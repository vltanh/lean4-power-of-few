name = "PowerOfFew"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Basic", "PowerOfFew", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "Basic"
globs = ["Basic.+"]

[[lean_lib]]
name = "PowerOfFew"
globs = ["PowerOfFew.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
