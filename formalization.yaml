# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The power of few: majority dynamics on random graphs (Tran and Vu)"
  description: >-
    A conditional formalization of two papers on majority dynamics on the Erdős–Rényi random graph
    G(n, p): L. Tran and V. Vu, "Reaching a consensus on random networks: the power of few"
    (Theory of Computing 19, 2023), and B. Tran and V. Vu, "The 'Power of Few' phenomenon: the sparse
    case" (Random Structures & Algorithms 66, 2025). It assumes, as a named hypothesis, the
    Berry–Esseen inequality with Shevtsova's constant 0.56. The sparse paper's spectral bound, which
    it takes from Theorem 3.2 of Benaych-Georges, Bordenave and Knowles and Theorem 6.10 of
    Boucheron, Lugosi and Massart, is proved by Feige and Ofek's argument.


    Proved: for constant p, a lead of c vertices wins within four days with probability
    1 − O(max{1/n, 1/c²}), with explicit bounds (on G(n, 1/2) with n ≥ 1000, a lead of five vertices
    wins with probability at least 0.9); above the connectivity threshold, a lead Δ with pΔ ≥ 10
    wins in O(log n/log(pn)) days with probability 1 − O(1/min{n, pΔ²} + n^(−λ/2)); consequences
    for random colourings, below the connectivity threshold, and with random activations and
    updates. Three theorems of the sparse paper (1.5, 1.7, 4.1) are false as printed: the
    formalization proves counterexamples and corrected versions.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

