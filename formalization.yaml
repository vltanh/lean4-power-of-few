      consulted.

status:
  scope: >-
    Conditional on one assumed result, stated as a hypothesis named after its source in every theorem
    that uses it: ShevtsovaBerryEsseen. Every result the two papers prove is formalized and proved,
    by the papers' arguments except the sparse Lemma A.7, which is proved by Feige and Ofek's argument
    at the author's request (the paper's own derivation from its two cited results is formalized too,
    with those results as hypotheses); the readings, corrections and departures are listed under
    fidelity. The sparse paper's Theorems 1.5, 1.7 and 4.1 are false as
    printed; counterexamples (unconditional) and corrected versions are proved. Not formalized: the
    papers' conjectures and numerical experiments, the dense paper's restatement of the theorem of
    Fountoulakis, Kang and Makai (its delayed form is proved), and remarks.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code (VS Code extension), versions 2.1.283 to 2.1.301"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, versions
        d82a98e1 and 04e714c7): one coordinating session that wrote the statements, integrated and
        checked the work, and wrote the report, with 34 sub-agents (at most 17 at once): provers with disjoint files,
        independent reviewers of the statements, of the proofs, of the findings, of the literature and
        of the report, and literature and follow-up searches.
      cost:
        wall_time: "6.2 h elapsed (2026-10-17, 07:10 to 13:21 CDT, to the commit completing REPORT.md); 20.4 h of sub-agent working time"
        spend_usd: "not tracked"
        hardware: "local machine (20 CPUs, 62 GB RAM) for the Lean builds; models through the Anthropic API"
      prompting_notes: >-
        The user invoked the skill with the two arXiv links and answered three scoping questions
        (the journal version of the dense paper; corrected versions of the false theorems with
        counterexamples; the constants and hypotheses the arguments give).
  spend_usd: "not tracked"
  notes: >-
    Fully agentic: the AI system wrote all code and documents; the user chose the scope. No person has
    reviewed the proofs. See CREDITS.md.

fidelity:
  divergences: >-
    Conditional formalization: the Berry–Esseen inequality with constant 0.56 (Shevtsova) is assumed as
    a hypothesis. Corrected statements (agreed with the user): sparse Theorem 1.5 assumes a bias
    ω(max{(pn)⁻¹, n^(−1/2)}); sparse Theorems 1.7 and 4.1 assume p_ac^(1/2) Δ ≥ S_ε n^(1/2) with a
    failure probability ε, and (1 − p) p_ac n ≥ 10, which the proofs use; Theorem 1.7's
    p p_ac n ≥ (1 + λ) n⁻¹ log n is read as (1 + λ) log n; counterexamples to the printed versions are
    proved. Constants and hypotheses that the arguments give (agreed with the user): sparse Lemma 2.1
    and Proposition 2.2 use the variance constant varConst in place of 7/12, and Proposition 2.2
    assumes D_c > 0; sparse Lemma 2.3 is stated for n ≥ 163 and 0 < b₂ ≤ b₁ ≤ 1/2 − 2/√n, and Lemma
    2.4 for 2√p ≤ a, b ≤ 1/2 − a/√(pn). Misprints corrected: the dense paper's P₂ uses the coefficient
    1.83 of its proof (printed 1.38), and Lemma 3.5 is stated with P₂ (its printed 0.025n form is proved
    for n ≥ 1288); sparse Proposition 4.2's "T > 0" is read as K > 0. Readings: the dense Theorem 1.6,
    Parts 2–4, and the sparse Lemma 2.6 and Propositions 4.3, 4.4 are stated as their proofs give
    them; sparse Lemma A.5 is uniform in δ and ε; constants hidden in O(·) and "n large" are explicit;
    dense Claim 2.6 is stated for |B₀| = ⌊n/2 − c⌋ and n ≥ 20. Redundant hypotheses dropped (the
    statements are more general): dense Theorem 1.5's ε ≤ 1, Theorem 1.6's c > 0 (kept in the
    Challenge), Claim 2.6's c > 0. Departures from the papers' proofs, each repairing a step that is
    wrong or has a gap (REPORT.md, Section 7): dense Theorem 1.2 (P₁ ≤ .0965 for the paper's .0902),
    Theorem 1.3 (K = 8φ⁻² + K′(p) + (2L/φ)²), Lemma 2.1 and Claim 2.5 (the general initial Blue set),
    Lemmas 3.4–3.6 (cases left out); sparse Proposition 2.2 (Lemma A.3 for every integer d), Lemmas
    2.3, 2.4 (an exact proof of the cube-root inequality), 2.6 (one more day), Theorem 1.2 (c = 3 for
    the paper's 10), Theorems 1.4, 1.5 and the dense Theorem 1.5 (the near-complete case
    p > 1 − 10/n), Theorem 3.1 (|B_t| ≤ n/4), Propositions 4.2 (c = 2; a wider Chernoff band) and 4.4
    (a concentration step before Lemma A.4), Lemmas A.5 and A.7 (repaired thresholds and cases, in the
    paper's derivation lemmaA_7_of_bbk_blm). Departure of a whole argument, at the author's request:
    the sparse Lemma A.7 is proved by Feige and Ofek's argument (a net of the unit ball, light pairs by
    an exponential-moment bound, heavy pairs by bounded degrees and discrepancy) instead of the paper's
    derivation from Theorem 3.2 of Benaych-Georges–Bordenave–Knowles and Theorem 6.10 of
    Boucheron–Lugosi–Massart, whose proofs need mathematics Lean lacks.

review:
  status: "agent-reviewed"
  reviewers:
    - "none"
  notes: >-
    No person has reviewed the formalization. Independent AI agents (which did not write what they
    checked) reviewed the statements against the TeX sources before the proofs were written,
    compared every formal proof with the papers' proofs, verified every finding of REPORT.md against
    the TeX, verified the literature account against its sources, and checked the report. Comparator
    accepts the solution under the Lean and NanoDa kernels; scripts/Audit.lean finds only the standard
    axioms; the route check confirms that every proof uses the results its paper's proof cites.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Dense paper, Theorem 1.6"
      lean: "Challenge.dense_theorem1_6"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "P₂ with the coefficient 1.83 of the paper's proof; Parts 2–4 as the paper proves them."
    - source: "Dense paper, Theorem 1.2"
      lean: "Challenge.dense_theorem1_2"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "As printed (n ≥ 1000, lead 5, probability 0.9)."
    - source: "Dense paper, Theorem 1.3"
      lean: "Challenge.dense_theorem1_3"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "As printed (there is K(p)); the proof's K differs from the paper's (REPORT.md, E5)."
    - source: "Sparse paper, Theorem 1.2"
      lean: "Challenge.sparse_theorem1_2"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "As printed; the constants may depend on λ."
    - source: "Sparse paper, Theorem 1.4"
      lean: "Challenge.sparse_theorem1_4"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "Delayed form of the theorem of Fountoulakis, Kang and Makai; a tie counts as a failure."
    - source: "Sparse paper, Theorem 1.5 (corrected)"
      lean: "Challenge.sparse_theorem1_5"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "Bias ω(max{(pn)⁻¹, n^(−1/2)}); the printed bias ω((pn)⁻¹) does not suffice."
    - source: "Sparse paper, Theorem 1.5 as printed"
      lean: "Challenge.sparse_theorem1_5_printed_false"
      module: "Challenge"
      status: "proved (the printed statement is false); unconditional"
      note: "Counterexample: p = 1, bias log n/n."
    - source: "Sparse paper, Theorem 3.1"
      lean: "Challenge.sparse_theorem3_1"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "As printed, with explicit constants depending on λ."
    - source: "Sparse paper, Theorem 1.7 (corrected)"
      lean: "Challenge.sparse_theorem1_7"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "Assumes Δ ≥ S√n and (1 − p) p_ac n ≥ 10, with failure probability ε."
    - source: "Sparse paper, Theorem 4.1 (corrected)"
      lean: "Challenge.sparse_theorem4_1"
      module: "Challenge"
      status: "proved, conditional on ShevtsovaBerryEsseen"
      note: "Assumes p_ac^(1/2) Δ ≥ S_ε n^(1/2) and (1 − p) p_ac n ≥ 10, with failure probability ε."
    - source: "Sparse paper, Theorem 1.7 as printed"
      lean: "Challenge.sparse_theorem1_7_printed_false_seq"
      module: "Challenge"
      status: "proved (the printed statement is false); unconditional"
      note: "Counterexample: p = 1, p_ac = 1/2, p_up = 1, Δ = ⌊n^(1/4)⌋."
    - source: "Sparse paper, Theorem 4.1 as printed"
      lean: "Challenge.sparse_theorem4_1_printed_false_seq"
      module: "Challenge"
      status: "proved (the printed statement is false); unconditional"
      note: "Same counterexample."
    - source: "Definition of Φ (both papers)"
      lean: "Challenge.Φ_eq_cdf_gaussianReal"
      module: "Challenge"
      status: "proved"
      note: "Identifies the Challenge's Φ with the distribution function of Mathlib's standard Gaussian law."

acknowledgements: >-
  Lean 4 and Mathlib (in particular Y. Dillies's binomial random graphs, the sub-Gaussian Hoeffding
  inequality and the central limit theorem infrastructure); Palomar's Comparator; the authors of the
  two papers, whose TeX sources made the audit possible.
